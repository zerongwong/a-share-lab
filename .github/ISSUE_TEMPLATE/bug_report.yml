name: Bug report
description: Report a reproducible software or data-quality problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, licensed data, real holdings, or unredacted screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
      description: Give minimal steps that do not contain licensed or personal data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: secret_check
    attributes:
      label: Sensitive-data check
      options:
        - I confirmed this report contains no credentials, licensed data, or real holdings.
    validations:
      required: true
